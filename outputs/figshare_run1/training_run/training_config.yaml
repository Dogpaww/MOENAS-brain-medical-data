dataset:
  data_root: data/figshare_brain_tumor
  image_size: 96
  input_channels: 3
  num_classes: 3
  validation_fraction: 0.2
  split_seed: 42
  batch_size: 32
  num_workers: 4
  group_aware_split: true
search_space:
  num_intermediate_nodes: 4
  edges_per_node: 2
  number_of_cells_min: 3
  number_of_cells_max: 11
  initial_channels_min: 8
  initial_channels_max: 48
  drop_path_probability: 0.2
  stem_type: cifar
proxies:
  zico_batch_size: 4
  zico_num_batches: 4
  proxy_sample_seed: 123
nsga2:
  population_size: 20
  num_generations: 10
  seed: 1
  crossover_prob: 0.9
  mutation_prob: null
  device: cuda
  topsis_weights:
  - 0.3
  - 0.3
  - 0.4
augmentation:
  population_size: 5
  num_generations: 5
  trial_epochs: 10
  learning_rate: 0.025
  weight_decay: 0.0003
  momentum: 0.9
  seed: 1
  mutation_prob: null
  device: cuda
training:
  physical_batch_size: 32
  gradient_accumulation_steps: 1
  final_epochs: 250
  learning_rate: 0.025
  weight_decay: 0.0007
  momentum: 0.9
  grad_clip_norm: 5.0
  precision: amp
  checkpoint_metric: macro_auc
  classifier_dropout_probability: 0.3
  label_smoothing: 0.1
  seed: 1
  device: auto
