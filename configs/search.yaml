# Dataset root must contain Training/ and Testing/ subfolders, each with the
# four class folders (glioma_tumor, meningioma_tumor, no_tumor, pituitary_tumor).
# Point this at the extracted Kaggle brain-tumor-classification-mri v2 dataset.
dataset:
  data_root: data/brain_tumor_mri
  image_size: 64
  input_channels: 3
  num_classes: 4
  validation_fraction: 0.15
  split_seed: 42
  batch_size: 32
  num_workers: 4

search_space:
  num_intermediate_nodes: 4
  edges_per_node: 2
  initial_channels: 16
  number_of_cells: 7
  drop_path_probability: 0.2
  stem_type: cifar

proxies:
  zico_batch_size: 4
  zico_num_batches: 4
  proxy_sample_seed: 123

nsga2:
  population_size: 20
  num_generations: 10
  seed: 1
  crossover_prob: 0.9
  mutation_prob: null
  device: cuda
  topsis_weights: [0.4, 0.4, 0.2]

augmentation:
  population_size: 5
  num_generations: 5
  trial_epochs: 10
  learning_rate: 0.025
  weight_decay: 0.0003
  seed: 1
  mutation_prob: null
  device: cuda

training:
  physical_batch_size: 32
  gradient_accumulation_steps: 1
  final_epochs: 200
  learning_rate: 0.025
  weight_decay: 0.0003
  grad_clip_norm: 5.0
  precision: amp
  checkpoint_metric: macro_auc
  seed: 1
  device: auto
