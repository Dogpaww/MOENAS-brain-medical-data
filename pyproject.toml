[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmri-nas"
version = "0.1.0"
description = "Clean reimplementation of a DARTS-style zero-cost NAS + augmentation-search pipeline for the Kaggle brain-tumor MRI dataset."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "thop>=0.1.1",
    "pymoo>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
